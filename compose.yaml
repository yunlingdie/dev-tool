name: dev-tool

services:
  web:
    image: node:22-bookworm
    working_dir: /workspace
    command:
      - sh
      - -c
      - npm install && exec npm run dev -- --host 0.0.0.0 --port 80
    expose:
      - "80"
    labels:
      dev.orbstack.http-port: "80"
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: volume
        source: node_modules
        target: /workspace/node_modules

volumes:
  node_modules:
